<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>AI Video Interviewer — Test Client</title>
<script src="https://cdn.jsdelivr.net/npm/livekit-client/dist/livekit-client.umd.min.js"></script>
<style>
  body { font-family: sans-serif; max-width: 600px; margin: 60px auto; text-align: center; }
  #status { margin: 20px 0; padding: 12px; border-radius: 8px; background: #f0f0f0; font-weight: bold; }
  button { padding: 12px 24px; font-size: 16px; margin: 6px; cursor: pointer; }
  #enableAudioBtn { display: none; background: #ffcc00; }
  .log { text-align: left; font-family: monospace; font-size: 12px; background: #111; color: #0f0;
         padding: 10px; height: 150px; overflow-y: auto; margin-top: 20px; }
</style>
</head>
<body>
  <h1>AI Video Interviewer</h1>
  <p>Milestone 2 test client — browser ↔ LiveKit ↔ Gemini</p>

  <div id="status">Not connected</div>

  <button id="startBtn">Start Interview</button>
  <button id="stopBtn" disabled>Stop Interview</button>
  <button id="enableAudioBtn">Click to enable audio</button>

  <div class="log" id="log"></div>

  <script>
    const statusEl = document.getElementById("status");
    const startBtn = document.getElementById("startBtn");
    const stopBtn = document.getElementById("stopBtn");
    const enableAudioBtn = document.getElementById("enableAudioBtn");
    const logEl = document.getElementById("log");

    let room = null;
    let pendingAudioEl = null;

    function log(msg) {
      const time = new Date().toLocaleTimeString();
      logEl.innerHTML += `[${time}] ${msg}<br>`;
      logEl.scrollTop = logEl.scrollHeight;
    }

    function setStatus(text) {
      statusEl.textContent = text;
    }

    async function startInterview() {
      startBtn.disabled = true;
      setStatus("Requesting token...");
      log("Requesting LiveKit token from local server...");

      let data;
      try {
        const res = await fetch("/token");
        data = await res.json();
        if (data.error) throw new Error(data.error);
      } catch (err) {
        setStatus("Failed to get token");
        log("ERROR getting token: " + err.message);
        startBtn.disabled = false;
        return;
      }

      log(`Got token for room "${data.room}" as "${data.identity}"`);
      setStatus("Connecting to LiveKit room...");

      room = new LivekitClient.Room();

      room.on(LivekitClient.RoomEvent.ConnectionStateChanged, (state) => {
        log("Connection state: " + state);
        setStatus("Connection: " + state);
      });

      room.on(LivekitClient.RoomEvent.ParticipantConnected, (participant) => {
        log("Participant joined: " + participant.identity);
      });

      room.on(LivekitClient.RoomEvent.TrackSubscribed, (track, publication, participant) => {
        log(`Subscribed to ${track.kind} track from ${participant.identity}`);
        if (track.kind === "audio") {
          const audioEl = track.attach();
          audioEl.autoplay = true;
          document.body.appendChild(audioEl);

          audioEl.play().catch(() => {
            log("Autoplay blocked by browser — click 'Click to enable audio'");
            pendingAudioEl = audioEl;
            enableAudioBtn.style.display = "inline-block";
          });
        }
      });

      room.on(LivekitClient.RoomEvent.Disconnected, () => {
        setStatus("Disconnected");
        log("Room disconnected.");
        startBtn.disabled = false;
        stopBtn.disabled = true;
      });

      try {
        await room.connect(data.url, data.token);
        log("Connected to room: " + data.room);
        setStatus("Connected — enabling microphone...");

        await room.localParticipant.setMicrophoneEnabled(true);
        log("Microphone published.");
        setStatus("Connected — waiting for AI interviewer to join...");

        stopBtn.disabled = false;
      } catch (err) {
        setStatus("Connection failed");
        log("ERROR connecting: " + err.message);
        startBtn.disabled = false;
      }
    }

    async function stopInterview() {
      if (room) {
        await room.disconnect();
        room = null;
      }
      startBtn.disabled = false;
      stopBtn.disabled = true;
      setStatus("Not connected");
    }

    enableAudioBtn.addEventListener("click", () => {
      if (pendingAudioEl) {
        pendingAudioEl.play();
        enableAudioBtn.style.display = "none";
      }
    });

    startBtn.addEventListener("click", startInterview);
    stopBtn.addEventListener("click", stopInterview);
  </script>
</body>
</html>
